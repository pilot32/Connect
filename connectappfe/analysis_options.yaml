include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    # Enforces stricter type safety rules
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treats minor issues as build-breaking compilation errors
    missing_required_param: error
    missing_return: error
    todo: ignore # Allows you to leave notes without breaking the build
    invalid_annotation_target: ignore

linter:
  rules:
    # Personal solo adjustments can go here (e.g., turning off rules you dislike)
    public_member_api_docs: false # Disables mandatory documentation for every single function
